<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Administrativo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="admin-btn-container">
    <a href="index.html" class="admin-btn">Ir al Carrusel de Productos</a>
  </div>
  <div class="container">
    <h2>Gestión de Productos</h2>
    <!-- Formulario para añadir o editar productos -->
    <form id="formAddProduct" enctype="multipart/form-data">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Digita el nombre del producto">
    
      <label for="descripcion">Descripción:</label>
      <input type="text" id="descripcion" name="descripcion" required placeholder="Ej: Fresco, orgánico, etc.">
    
      <label for="precio">Precio:</label>
      <input type="number" id="precio" name="precio" required placeholder="Ej: 2500">
    
      <label for="imagen">Imagen:</label>
      <input type="file" id="imagen" name="imagen" accept=".jpg, .jpeg, .png">
      <img id="imagenActual" style="display:none; max-width:100px; margin-top:10px;">
    
      <button type="submit">Añadir Producto</button>
    </form>
      
    <button id="btnMostrarFormulario" class="toggle-form-btn">Agregar producto</button>
    <!-- Lista de productos -->
    <ul id="productList"></ul>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
